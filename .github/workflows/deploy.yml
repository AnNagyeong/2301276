name: Collect and deploy Pages
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Restore last successful snapshot
        uses: actions/cache/restore@v4
        with:
          path: |
            data/metadata.json
            data/snapshots
          key: snapshot-${{ github.run_id }}
          restore-keys: snapshot-
      - name: Check collection requirements
        id: snapshot
        run: node scripts/needs-collection.mjs
      - name: Collect real API data
        id: collect
        if: github.event_name == 'workflow_dispatch' || steps.snapshot.outputs.collect == 'true'
        continue-on-error: true
        run: npm run collect
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      - name: Cache successful snapshot
        if: steps.collect.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            data/metadata.json
            data/snapshots
          key: snapshot-${{ github.run_id }}
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Collection warning
        if: steps.collect.outcome == 'failure'
        run: echo '::warning::Collection failed. Published snapshot is stale or unavailable; see on-page status.'
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
